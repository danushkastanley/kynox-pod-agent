apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rasp-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: pod-agent
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: rasp-controller
    ports:
    - protocol: TCP
      port: 50051
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53  # Allow DNS queries
  ingress: []  # No incoming connections needed for the agent
