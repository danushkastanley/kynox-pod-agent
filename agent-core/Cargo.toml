[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
description = "Core library for eBPF-based RASP agent"

[dependencies]
anyhow = "1.0"
env_logger = "0.10"
libbpf-rs = "0.20"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
libbpf-cargo = "0.20"
