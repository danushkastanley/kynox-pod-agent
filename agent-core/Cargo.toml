[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
description = "Core library for eBPF-based RASP agent"
license = "MIT"
repository = "https://github.com/danushkastanley/pod-agent"

[dependencies]
anyhow = "1.0"
libbpf-rs = { version = "0.26.2", features = ["vendored"] }
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
libbpf-cargo = "0.26.2"
