name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake autopoint bison build-essential clang flex gawk gettext libtool llvm libelf-dev libbpf-dev pkg-config protobuf-compiler
      - name: Select stable Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
