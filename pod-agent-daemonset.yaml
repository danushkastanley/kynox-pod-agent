apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-agent-ds
  labels:
    app: pod-agent
spec:
  selector:
    matchLabels:
      app: pod-agent
  template:
    metadata:
      labels:
        app: pod-agent
    spec:
      # Consider hostNetwork/hostPID if agent needs them
      # hostNetwork: true 
      # hostPID: true 
      containers:
      - name: pod-agent 
        # --- Use local image ---
        image: pod-agent:latest         # Use local tag
        imagePullPolicy: IfNotPresent # Use local image
        # --- End image config ---
        securityContext:
          privileged: true              # Needed for eBPF kernel access
        volumeMounts:                 # Mount necessary host paths
        - name: sys-kernel-debug
          mountPath: /sys/kernel/debug
          readOnly: true 
        # Add other required mounts:
        # - name: proc-fs
        #   mountPath: /proc
        #   readOnly: true
        # - name: sys-fs-bpf
        #   mountPath: /sys/fs/bpf
      terminationGracePeriodSeconds: 30
      volumes:                        # Define the hostPath volumes
      - name: sys-kernel-debug
        hostPath:
          path: /sys/kernel/debug
          type: Directory
      # Define other volumes here:
      # - name: proc-fs
      #   hostPath:
      #     path: /proc
      #     type: Directory
      # - name: sys-fs-bpf
      #   hostPath:
      #     path: /sys/fs/bpf
      #     type: DirectoryOrCreate # Needed if agent mounts BPF maps here
